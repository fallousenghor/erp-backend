<div class="event-detail">
  <app-loading-spinner [isLoading]="loading" message="Chargement des détails..."></app-loading-spinner>

  <div *ngIf="!loading && event" class="detail-container">
    <div class="detail-header">
      <button mat-icon-button matTooltip="Retour" (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h2>{{ event.name }}</h2>
      <div class="detail-actions">
        <button mat-raised-button (click)="editEvent()">
          <mat-icon>edit</mat-icon> Modifier
        </button>
        <button mat-raised-button color="warn" (click)="deleteEvent()">
          <mat-icon>delete</mat-icon> Supprimer
        </button>
      </div>
    </div>

    <mat-card>
      <mat-card-content>
        <mat-grid-list cols="2" rowHeight="150px">
          <mat-grid-tile>
            <div class="detail-field">
              <strong>Date:</strong>
              <p>{{ event.date | date: 'dd/MM/yyyy HH:mm' }}</p>
            </div>
          </mat-grid-tile>
          <mat-grid-tile>
            <div class="detail-field">
              <strong>Lieu:</strong>
              <p>{{ event.location }}</p>
            </div>
          </mat-grid-tile>
          <mat-grid-tile>
            <div class="detail-field">
              <strong>Responsable:</strong>
              <p>{{ event.responsibleName }}</p>
            </div>
          </mat-grid-tile>
          <mat-grid-tile>
            <div class="detail-field">
              <strong>Budget:</strong>
              <p>{{ event.budget | currencyXof }}</p>
            </div>
          </mat-grid-tile>
        </mat-grid-list>

        <div class="detail-section">
          <h3>Description</h3>
          <p>{{ event.description }}</p>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <div *ngIf="!loading && !event" class="no-data">
    <p>Événement non trouvé</p>
  </div>
</div>
