<div class="materials-list">
  <div class="list-header">
    <h2>Gestion du Matériel</h2>
    <button mat-raised-button color="primary" (click)="navigateToAdd()">
      <mat-icon>add</mat-icon> Ajouter du Matériel
    </button>
  </div>

  <app-loading-spinner [isLoading]="loading" message="Chargement..."></app-loading-spinner>

  <table mat-table [dataSource]="materials" class="materials-table" *ngIf="!loading">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nom</th>
      <td mat-cell *matCellDef="let element">{{ element.name }}</td>
    </ng-container>

    <!-- Category Column -->
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Catégorie</th>
      <td mat-cell *matCellDef="let element">{{ element.category }}</td>
    </ng-container>

    <!-- Quantity Column -->
    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef>Quantité</th>
      <td mat-cell *matCellDef="let element">{{ element.quantity }}</td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>État</th>
      <td mat-cell *matCellDef="let element">
        <mat-chip [color]="getStatusColor(element.status)" selected>
          {{ element.status }}
        </mat-chip>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button (click)="editMaterial(element.id)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteMaterial(element)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <div *ngIf="!loading && materials.length === 0" class="no-data">
    <p>Aucun matériel enregistré</p>
  </div>
</div>
