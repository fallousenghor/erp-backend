<div class="ceremonial-year-form-container">
  <h1>Nouvelle année cérémoniale</h1>

  <mat-card class="form-card">
    <mat-card-content>
      <form [formGroup]="yearForm" (ngSubmit)="onSubmit()">
        <div class="form-row">
          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Année</mat-label>
            <input matInput
                   type="number"
                   formControlName="year"
                   placeholder="2024"
                   min="2000"
                   max="2100"
                   required>
            <mat-error *ngIf="f['year'].hasError('required')">
              L'année est requise
            </mat-error>
            <mat-error *ngIf="f['year'].hasError('min') || f['year'].hasError('max')">
              L'année doit être entre 2000 et 2100
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Thème de l'année</mat-label>
            <input matInput
                   type="text"
                   formControlName="theme"
                   placeholder="Année 2024"
                   required>
            <mat-error *ngIf="f['theme'].hasError('required')">
              Le thème est requis
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Date de début</mat-label>
            <input matInput
                   [matDatepicker]="startDatePicker"
                   formControlName="startDate"
                   required>
            <mat-datepicker-toggle matSuffix [for]="startDatePicker"></mat-datepicker-toggle>
            <mat-datepicker #startDatePicker></mat-datepicker>
            <mat-error *ngIf="f['startDate'].hasError('required')">
              La date de début est requise
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Date de fin</mat-label>
            <input matInput
                   [matDatepicker]="endDatePicker"
                   formControlName="endDate"
                   required>
            <mat-datepicker-toggle matSuffix [for]="endDatePicker"></mat-datepicker-toggle>
            <mat-datepicker #endDatePicker></mat-datepicker>
            <mat-error *ngIf="f['endDate'].hasError('required')">
              La date de fin est requise
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="form-field full-width">
            <mat-label>Budget initial</mat-label>
            <input matInput
                   type="number"
                   formControlName="initialBudget"
                   placeholder="0"
                   min="0"
                   step="0.01"
                   required>
            <span matSuffix>FCFA</span>
            <mat-error *ngIf="f['initialBudget'].hasError('required')">
              Le budget initial est requis
            </mat-error>
            <mat-error *ngIf="f['initialBudget'].hasError('min')">
              Le budget doit être positif
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="form-field full-width">
            <mat-label>Description</mat-label>
            <textarea matInput
                      formControlName="description"
                      placeholder="Description de l'année cérémoniale"
                      rows="3"></textarea>
          </mat-form-field>
        </div>

        <div class="form-actions">
          <button mat-button type="button" (click)="cancel()">
            Annuler
          </button>
          <button mat-raised-button
                  color="primary"
                  type="submit"
                  [disabled]="loading || yearForm.invalid">
            <mat-spinner *ngIf="loading" diameter="20" class="spinner"></mat-spinner>
            <span>Créer</span>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
