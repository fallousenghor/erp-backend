<div class="members-container">
  <div class="header">
    <h1>Gestion des Membres</h1>
    <button mat-raised-button color="primary" (click)="addMember()">
      <mat-icon>add</mat-icon>
      Nouveau Membre
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Rechercher</mat-label>
        <input matInput (keyup)="applyFilter($event)" 
               placeholder="Nom, prénom, téléphone...">
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>

      <div *ngIf="loading" class="loading">
        <mat-spinner></mat-spinner>
      </div>

      <div *ngIf="!loading" class="table-container">
        <table mat-table [dataSource]="dataSource" matSort>
          
          <ng-container matColumnDef="memberNumber">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>N° Membre</th>
            <td mat-cell *matCellDef="let member">{{member.memberNumber}}</td>
          </ng-container>

          <ng-container matColumnDef="fullName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom Complet</th>
            <td mat-cell *matCellDef="let member">
              {{member.firstName}} {{member.lastName}}
            </td>
          </ng-container>

          <ng-container matColumnDef="phoneNumber">
            <th mat-header-cell *matHeaderCellDef>Téléphone</th>
            <td mat-cell *matCellDef="let member">{{member.phoneNumber}}</td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let member">{{member.email || '-'}}</td>
          </ng-container>

          <ng-container matColumnDef="active">
            <th mat-header-cell *matHeaderCellDef>Statut</th>
            <td mat-cell *matCellDef="let member">
              <mat-chip [color]="member.active ? 'primary' : 'warn'">
                {{member.active ? 'Actif' : 'Inactif'}}
              </mat-chip>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let member">
              <button mat-icon-button (click)="viewMember(member)">
                <mat-icon>visibility</mat-icon>
              </button>
              <button mat-icon-button (click)="editMember(member)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteMember(member)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="6">Aucun membre trouvé</td>
          </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" 
                       showFirstLastButtons>
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
