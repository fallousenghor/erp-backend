
# ==============================================================================
# COMPANY ERP — Docker Compose (Development)
# ==============================================================================
services:

  # ============================================================================
  # PostgreSQL Database (Local Dev)
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Neon PostgreSQL (Remote/Prod - Use .env vars)
  # ============================================================================
  # For Neon DB, disable local postgres and use .env:
  # DB_URL=jdbc:postgresql://ep-proud-star-amu3grm8-pooler.c-5.us-east-1.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require
  # DB_USERNAME=neondb_owner
  # DB_PASSWORD=npg_Zma5Y1rjKtcV

  # ============================================================================
  # ERP Application 
  # ============================================================================
  erp-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-application
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    volumes:
      - app_logs:/app/logs
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  app_logs:
    driver: local
  postgres_data:

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  erp-network:
    driver: bridge
