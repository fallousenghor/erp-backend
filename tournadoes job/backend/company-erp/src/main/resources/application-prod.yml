# ==============================================================================
# COMPANY ERP — PRODUCTION PROFILE
# ==============================================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
  flyway:
    clean-disabled: true

logging:
  level:
    root: WARN
    com.company.erp: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
