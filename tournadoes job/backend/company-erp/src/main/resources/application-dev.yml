# ==============================================================================
# COMPANY ERP — DEVELOPMENT PROFILE
# ==============================================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        generate_statistics: false
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    root: WARN
    com.company.erp: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
